model:
  name: DenseNet201
  pretrained: true
  num_classes: 2
  input_channels: 1
  first_layer: features.conv0
  classifier: classifier
  dropout: 0.0
  freezing:
    enabled: true
    freeze_layers:
    - features.norm0
    - features.denseblock1
    - features.transition1
    - features.denseblock2
    - features.transition2
    - features.denseblock3
    - features.transition3
